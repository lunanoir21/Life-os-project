<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Subtle radial glow anchored to the pulse peak -->
    <radialGradient id="glow" cx="54%" cy="50%" r="52%">
      <stop offset="0%"  stop-color="#00e87a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter for the main strokes -->
    <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="#050508"/>
  <rect width="200" height="200" rx="44" fill="url(#glow)"/>

  <!-- ─── L vertical arm ─────────────────────────────────── -->
  <line x1="58" y1="34" x2="58" y2="152"
        stroke="#00e87a" stroke-width="13" stroke-linecap="round"
        filter="url(#line-glow)"/>

  <!-- ─── L horizontal arm with embedded pulse ──────────── -->
  <!--
    Flat → spike UP → back to baseline → small bump → flat
    Baseline y = 152
    Peak    y = 96   (pulse apex)
    Bump    y = 124
  -->
  <polyline
    points="58,152 92,152 106,96 118,152 128,124 140,152 166,152"
    stroke="#00e87a" stroke-width="13"
    stroke-linecap="round" stroke-linejoin="round" fill="none"
    filter="url(#line-glow)"/>

  <!-- ─── Terminal nodes ─────────────────────────────────── -->
  <!-- Top node (filled) -->
  <circle cx="58"  cy="34"  r="9.5" fill="#00e87a"/>

  <!-- Pulse peak indicator (small bright dot at apex) -->
  <circle cx="106" cy="96"  r="5"   fill="#00e87a" opacity="0.75"/>

  <!-- Bottom-right end node (filled) -->
  <circle cx="166" cy="152" r="9.5" fill="#00e87a"/>

  <!-- Inner corner node (hollow ring — devre köşesi) -->
  <circle cx="58"  cy="152" r="8"
          fill="#050508" stroke="#00e87a" stroke-width="3.5"/>
</svg>
