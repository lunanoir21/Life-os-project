name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./prisma/dev.db
  BACKEND_DATABASE_URL: sqlite:../prisma/dev.db
  NEXT_TELEMETRY_DISABLED: 1

# ─────────────────────────────────────────────────────────────────────────────
# Frontend job: typecheck → lint → test → build
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Build
        run: bun run build

# ─────────────────────────────────────────────────────────────────────────────
# Backend job: fmt → clippy → test (unit + integration)
# ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (for DB setup)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable + rustfmt + clippy)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Node.js dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Setup database for integration tests
        run: bun run db:push

      - name: Verify database was created
        run: |
          echo "Checking if database exists..."
          ls -lh prisma/dev.db
          echo "Database size: $(du -h prisma/dev.db | cut -f1)"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --check
        working-directory: backend

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: backend
        env:
          SQLX_OFFLINE: true

      - name: Build tests
        run: cargo test --no-run --no-fail-fast
        working-directory: backend
        env:
          DATABASE_URL: sqlite:../prisma/dev.db

      - name: Run all tests (unit + integration)
        run: cargo test --no-fail-fast -- --test-threads=1 --nocapture
        working-directory: backend
        env:
          DATABASE_URL: sqlite:../prisma/dev.db
          RUST_BACKTRACE: 1

# ─────────────────────────────────────────────────────────────────────────────
# E2E job: Playwright tests
# ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Setup database
        run: bun run db:push

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend
        run: cargo build --release
        working-directory: backend

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start backend server
        run: nohup cargo run --release > backend.log 2>&1 &
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Start frontend server
        run: nohup bun run dev > frontend.log 2>&1 &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Wait for services
        run: |
          echo "Waiting for frontend..."
          timeout 90 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; echo "Retrying..."; done'
          echo "Frontend ready!"
          
          echo "Waiting for backend..."
          timeout 90 bash -c 'until curl -sf http://localhost:8080/api/health > /dev/null; do sleep 2; echo "Retrying..."; done'
          echo "Backend ready!"

      - name: Run Playwright tests
        run: bunx playwright test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Frontend logs ==="
          cat frontend.log || echo "No frontend logs"
          echo "=== Backend logs ==="
          cat backend/backend.log || echo "No backend logs"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Docker job: Build verification
# ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: lifeos:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=${{ env.DATABASE_URL }}
